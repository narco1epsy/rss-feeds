name: Update RSS

on:
  schedule:
    - cron: '15 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scrapers/*.js'
      - '.github/workflows/scrape.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - name: Run scrapers
        id: scrape
        shell: bash
        run: |
          set +e

          failed=0

          for f in scrapers/*.js; do
            echo "::group::${f}"
            output="$(node "$f" 2>&1)"
            status=$?

            printf '%s\n' "$output"

            if [ $status -ne 0 ]; then
              failed=1

              msg="$(printf '%s' "$output" | tail -n 20)"
              msg="${msg//'%'/'%25'}"
              msg="${msg//$'\n'/'%0A'}"
              msg="${msg//$'\r'/'%0D'}"

              echo "::error file=${f},title=Scraper failed::exit ${status}%0A${msg}"
            fi

            echo "::endgroup::"
          done

          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish to gh-pages root
        shell: bash
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          mkdir -p /tmp/rss
          find docs -maxdepth 1 -name '*.xml' -exec cp {} /tmp/rss/ \;
          touch /tmp/rss/.nojekyll

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp /tmp/rss/*.xml ./
          cp /tmp/rss/.nojekyll ./

          git add -A .

          if ! git diff --cached --quiet; then
            git commit -m "Update RSS feeds: $(date +'%Y-%m-%d %H:%M')"
            git push origin gh-pages
          fi

      - name: Finalize status
        if: ${{ always() && steps.scrape.outputs.failed == '1' }}
        run: |
          echo "One or more scrapers failed. See Annotations."
          exit 1